[project]
name = "pbad"
version = "0.1.0"
description = "How many questions are enough? Uncertainty-driven question selection for VLM calorie estimation (Nutrition5k)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "openai>=1.40",
    "requests>=2.32",
    "pillow>=10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
vlm = ["vllm>=0.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
